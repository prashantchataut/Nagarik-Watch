<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Nagarik Watch">
  <title>Nagarik Watch</title>
  <!-- Rounded crimson badge. Fixed hex (not OKLCH) so the favicon renders in all
       browser tab contexts where CSS custom properties would not resolve. -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#C02A2A" />
  <rect x="1.5" y="1.5" width="45" height="22" rx="11" fill="#ffffff" opacity="0.05" />
  <!-- Watchtower Eye: almond eye shape (vigilance) -->
  <path d="M8 24 Q24 12 40 24 Q24 36 8 24 Z" fill="#FEFDFD" opacity="0.97" />
  <!-- Himalayan peak iris (Nepal) -->
  <path d="M17 24 L21 17.5 L23.5 21 L26 16 L31 24 Z" fill="#9E1F22" />
  <path d="M17 24 L20 21 L22 23 L24 20 L26 22.5 L31 24 Z" fill="#C02A2A" opacity="0.55" />
  <!-- Gold signal dot at the apex -->
  <circle cx="26" cy="16.5" r="1.5" fill="#E0A82E" />
  <!-- Lower lash line -->
  <path d="M10 27.5 Q24 33 38 27.5" fill="none" stroke="#FEFDFD" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
</svg>
