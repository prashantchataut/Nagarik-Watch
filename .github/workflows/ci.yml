name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: launch verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify canonical workspaces
        run: node scripts/verify-canonical-workspaces.mjs

      - name: Verify workspace lockfile
        run: node scripts/verify-workspace-lock.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # Supply-chain gate: fail only on high/critical advisories in the
      # production dependency graph. Dev-only issues do not block CI.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Static product audits
        run: pnpm verify:static

      # Unit-test the budget script itself before depending on build output.
      - name: Performance budget self-test
        run: pnpm perf:budget:test

      - name: Web build
        run: pnpm build:web

      # Baseline performance budget proven from the build artifacts: no single
      # public JS chunk may exceed the (env-overridable) per-chunk ceiling.
      - name: Performance budget
        run: pnpm perf:budget

      - name: Admin build
        run: pnpm build:admin

      - name: DB tests
        run: pnpm --filter @nagarikwatch/db test

  a11y:
    name: accessibility audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run accessibility audit
        run: pnpm test:a11y
        env:
          CONTENT_SOURCE: json
          CI: 'true'

  e2e:
    name: full reader critical-path e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run full Playwright suite
        run: pnpm test:e2e
        env:
          CONTENT_SOURCE: json
          CI: 'true'
          E2E_TEST: 'true'

  payload-smoke:
    name: payload + launch honesty smoke
    runs-on: ubuntu-latest
    env:
      PAYLOAD_PUBLIC_SERVER_URL: ${{ secrets.PAYLOAD_PUBLIC_SERVER_URL }}
      PAYLOAD_API_TOKEN: ${{ secrets.PAYLOAD_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Always run: cutover checklist shape, publication honesty, content-source resolution.
      # Does not require live Payload secrets (stops JSON-only false confidence on wiring).
      - name: Launch honesty + cutover unit tests
        run: >
          pnpm --filter @nagarikwatch/web exec vitest run
          lib/content/content-source.test.ts
          lib/content/payload-source.contract.test.ts
          lib/editorial/ops-workers.test.ts
          lib/site.test.ts
          lib/launch-phases.test.ts
          lib/launch-readiness.test.ts
          lib/launch-gate-core.test.ts
        env:
          CONTENT_SOURCE: json
          CI: 'true'

      - name: Gate on live Payload secrets
        id: gate
        run: |
          if [ -n "${PAYLOAD_PUBLIC_SERVER_URL}" ] && [ -n "${DATABASE_URL}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PAYLOAD_PUBLIC_SERVER_URL or DATABASE_URL secret unset — skipping live Payload env smoke."
          fi

      - name: Payload canonical env smoke
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @nagarikwatch/web test lib/content/content-source.test.ts
        env:
          CONTENT_SOURCE: payload
          PAYLOAD_PUBLIC_SERVER_URL: ${{ env.PAYLOAD_PUBLIC_SERVER_URL }}
          PAYLOAD_API_TOKEN: ${{ env.PAYLOAD_API_TOKEN }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          CI: 'true'

  live-gate:
    name: live-gate fixture parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Live gate fails closed without secrets
        run: |
          set +e
          NEXT_PUBLIC_LAUNCH_STATUS=live pnpm launch:gate
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected launch:gate to fail without live secrets"
            exit 1
          fi

      - name: Live gate passes with safe fixtures
        env:
          NEXT_PUBLIC_LAUNCH_STATUS: live
          NEXT_PUBLIC_SITE_URL: https://www.nagarikwatch.com
          BETTER_AUTH_URL: https://www.nagarikwatch.com
          DATABASE_URL: postgres://nagarik:nagarik@localhost:5432/nagarik
          AUTH_SECRET: fixture-auth-secret-32-characters!
          CONTENT_SOURCE: payload
          PAYLOAD_PUBLIC_SERVER_URL: https://admin.nagarikwatch.com
          PAYLOAD_API_TOKEN: fixture-payload-service-account-token
          PAYLOAD_SECRET: fixture-payload-secret-32-characters!
          REVALIDATE_SECRET: fixture-revalidate-secret-32-chars!
          PAYLOAD_DB_PUSH: 'false'
          NEXT_PUBLIC_PUBLICATION_LEGAL_NAME: CI Fixture Publisher Pvt Ltd
          NEXT_PUBLIC_EDITOR_IN_CHIEF: CI Fixture Editor
          NEXT_PUBLIC_DOIB_NUMBER: NW-CI-FIXTURE-REG-99
          NEXT_PUBLIC_NEWSROOM_PHONE: '+977-01-4000000'
          NEXT_PUBLIC_NEWSROOM_ADDRESS: Kathmandu fixture address
          NEXT_PUBLIC_NEWSROOM_EMAIL: desk@example.com
          RESEND_API_KEY: re_fixture_key
          AUTH_EMAIL_FROM: Nagarik Watch <accounts@example.com>
          NEWSLETTER_FROM: Nagarik Watch <newsletter@example.com>
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_fixture_token
          SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          CRON_SECRET: fixture-cron-secret-32-characters!!
          STAFF_MFA_ENABLED: 'true'
          CAPTCHA_PROVIDER: turnstile
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: site-key-example
          TURNSTILE_SECRET_KEY: secret-key-example
          SUBMISSION_IP_SALT: fixture-submission-salt-32-chars!!
          PARTNER_FEED_TOKENS: nw_partner_ci_fixture_token_ok
          NEXT_PUBLIC_ADS_MODE: 'off'
          PUBLISHED_ARTICLE_COUNT: '30'
        run: pnpm launch:gate
