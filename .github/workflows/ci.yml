name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: launch verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify canonical workspaces
        run: node scripts/verify-canonical-workspaces.mjs

      - name: Verify workspace lockfile
        run: node scripts/verify-workspace-lock.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # Supply-chain gate: fail only on high/critical advisories in the
      # production dependency graph. Dev-only issues do not block CI.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Static product audits
        run: pnpm verify:static

      # Unit-test the budget script itself before depending on build output.
      - name: Performance budget self-test
        run: pnpm perf:budget:test

      - name: Web build
        run: pnpm build:web

      # Baseline performance budget proven from the build artifacts: no single
      # public JS chunk may exceed the (env-overridable) per-chunk ceiling.
      - name: Performance budget
        run: pnpm perf:budget

      - name: Admin build
        run: pnpm build:admin

      - name: DB tests
        run: pnpm --filter @nagarikwatch/db test

  a11y:
    name: accessibility audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run accessibility audit
        run: pnpm test:a11y
        env:
          CONTENT_SOURCE: json
          CI: 'true'

  e2e:
    name: full reader critical-path e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run full Playwright suite
        run: pnpm test:e2e
        env:
          CONTENT_SOURCE: json
          CI: 'true'
          E2E_TEST: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
